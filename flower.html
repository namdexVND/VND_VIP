<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tạo thiệp hoa 20/10</title>
<style>
  :root{--bg:#0b1230;--panel:#121b3d;--field:#0c1431;--line:#26335f;--fg:#f4f1ff;--muted:#a9b0d6;--accent:#ff6fb5;--ink:#2a0720;--ok:#4fd39a;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 40px}
  .wrap{max-width:720px;margin:0 auto;display:grid;gap:18px}
  h1{margin:0;font-size:24px}
  p.sub{margin:4px 0 0;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .field{display:grid;gap:6px;min-width:0}
  label{font-size:13px;color:var(--muted);font-weight:500}
  input,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{resize:vertical;min-height:96px}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--ink)}
  button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:13px;color:var(--muted);min-height:1.2em}
  .hint{font-size:12px;color:var(--muted)}
  #result{display:none;gap:14px;justify-items:center;text-align:center}
  #result.on{display:grid}
  #qr{background:#fff;border-radius:12px;padding:12px;max-width:100%}
  #qr canvas,#qr img{display:block;max-width:100%;height:auto}
  .linkrow{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%}
  .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  a.btn{display:inline-block;text-decoration:none;font-weight:600;border-radius:10px;padding:11px 16px;border:1px solid var(--line);color:var(--fg)}
</style></head>
<body>
<div class="wrap">
  <header><h1>Tạo thiệp hoa 20/10</h1><p class="sub">Sửa lời chúc, thêm ảnh, rồi nhận link và mã QR để gửi.</p></header>

  <div class="panel">
    <div class="field"><label for="message">Lời chúc *</label>
      <textarea id="message" maxlength="500"></textarea></div>
    <div class="row">
      <div class="field"><label for="tag">Dòng nhỏ trên cùng</label><input id="tag" type="text" maxlength="20"></div>
      <div class="field"><label for="title">Tiêu đề</label><input id="title" type="text" maxlength="30"></div>
    </div>
    <div class="row">
      <div class="field"><label for="sub">Dòng phụ</label><input id="sub" type="text" maxlength="40"></div>
      <div class="field"><label for="from">Lời ký</label><input id="from" type="text" maxlength="60"></div>
    </div>
    <div class="field"><label for="hint">Chữ dưới phong bì</label><input id="hint" type="text" maxlength="40"></div>
  </div>

  <div class="panel">
    <div class="field"><label for="photos">Ảnh (mỗi dòng một link, tối đa 10)</label>
      <textarea id="photos" placeholder="https://..."></textarea>
      <div class="acts" style="justify-content:flex-start">
        <button class="alt" id="pick" type="button">Tải ảnh từ máy</button>
        <input id="file" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="msg" id="upMsg"></div>
      <div class="hint">Ảnh tải lên được lưu ở dịch vụ lưu ảnh công khai bên ngoài, ai có link ảnh đều xem được.</div></div>
    <div class="field"><label for="captions">Chú thích ảnh (mỗi dòng một câu, xoay vòng)</label><textarea id="captions"></textarea></div>
    <div class="field"><label for="music">Nhạc nền (link .mp3, không bắt buộc)</label><input id="music" type="text" placeholder="https://..."></div>
    <div class="row">
      <div class="field"><label for="speed">Tốc độ chữ (ms/ký tự, nhỏ = nhanh)</label><input id="speed" type="number" min="20" max="300" value="85"></div>
      <div class="field"><label for="hold">Giữ thiệp sau khi chạy chữ (giây)</label><input id="hold" type="number" min="0" max="60" value="3"></div>
    </div>
  </div>

  <div class="panel">
    <button id="make" type="button">Tạo link và mã QR</button>
    <div class="msg" id="makeMsg"></div>
  </div>

  <div class="panel" id="result">
    <div id="qr"></div>
    <div class="linkrow"><input id="linkOut" type="text" readonly><button id="copy" type="button">Sao chép</button></div>
    <div class="acts">
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">Mở thiệp</a>
      <button class="alt" id="dl" type="button">Tải mã QR</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var DEF = {
    message: 'Chúc bạn luôn rạng rỡ như đóa hoa dưới ánh trăng, ngập tràn yêu thương và bình an mỗi ngày. 💗',
    tag: '20 · 10', title: 'Chúc Mừng', sub: 'Ngày Phụ Nữ Việt Nam', from: '— Với tất cả yêu thương',
    hint: '✦ Chạm để mở thiệp ✦', captions: '20 · 10 ♥\nHoa & Trăng\nYêu thương\nRạng rỡ\nBình an'
  };
  var FIELDS = ['message', 'tag', 'title', 'sub', 'from', 'hint', 'photos', 'captions', 'music', 'speed', 'hold'];
  var KEY = 'flower-thiep-v1', link = '', qrCanvas = null;

  function lines(t) { return String(t || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }

  function restore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    FIELDS.forEach(function (id) {
      var v = s && typeof s[id] === 'string' ? s[id] : (DEF[id] != null ? DEF[id] : null);
      if (v != null) $(id).value = v;
    });
  }
  function save() {
    try { var o = {}; FIELDS.forEach(function (id) { o[id] = $(id).value; }); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  /* ---------- mã QR ---------- */
  function drawQr(text) {
    var q = window.qrcode(0, 'M');
    q.addData(text); q.make();
    var n = q.getModuleCount(), cell = 8, quiet = 4, size = (n + quiet * 2) * cell;
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    x.fillStyle = '#b3185a';
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
    c.style.width = Math.min(280, size) + 'px';
    return c;
  }

  /* ---------- tạo link ---------- */
  function create() {
    var btn = $('make'), msg = $('makeMsg');
    var data = {
      message: $('message').value.trim(), tag: $('tag').value.trim(), title: $('title').value.trim(),
      sub: $('sub').value.trim(), from: $('from').value.trim(), hint: $('hint').value.trim(),
      photos: lines($('photos').value).slice(0, 10), captions: lines($('captions').value).slice(0, 8),
      music: $('music').value.trim(), speed: parseFloat($('speed').value), hold: parseFloat($('hold').value)
    };
    if (!data.message) { msg.textContent = 'Hãy nhập lời chúc.'; return; }
    if (!window.qrcode) { msg.textContent = 'Chưa tải được thư viện QR, kiểm tra mạng rồi tải lại trang.'; return; }
    btn.disabled = true; msg.textContent = 'Đang tạo link…';
    fetch('/api/flower-create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Lỗi tạo link'); return j; }); })
      .then(function (j) {
        link = j.url;
        $('linkOut').value = link; $('open').href = link;
        qrCanvas = drawQr(link);
        var box = $('qr'); box.textContent = ''; box.appendChild(qrCanvas);
        $('result').classList.add('on');
        msg.textContent = j.persistent === false ? 'Đã tạo (chế độ chạy thử: chưa nối database nên link sẽ mất khi server khởi động lại).' : 'Đã tạo link.';
        $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      })
      .catch(function (e) { msg.textContent = e.message; })
      .then(function () { btn.disabled = false; });
  }
  function copyLink() {
    var el = $('linkOut'), msg = $('makeMsg');
    function ok() { msg.textContent = 'Đã sao chép link.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(ok, function () { el.select(); document.execCommand('copy'); ok(); });
    else { el.select(); document.execCommand('copy'); ok(); }
  }
  function download() {
    if (!qrCanvas) return;
    qrCanvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'thiep-hoa-qr.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  }

  /* ---------- tải ảnh từ máy (dùng chung /api/flower-upload) ---------- */
  function compress(file) {
    return new Promise(function (res, rej) {
      var im = new Image(), u = URL.createObjectURL(file);
      var to = setTimeout(function () { URL.revokeObjectURL(u); rej(new Error('Không đọc được ảnh, thử ảnh JPG/PNG khác')); }, 15000);
      im.onload = function () {
        clearTimeout(to);
        var M = 1024, k = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        var x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        var q = 0.82, b64 = c.toDataURL('image/jpeg', q).split(',')[1];
        while (b64.length > 600000 && q > 0.4) { q -= 0.12; b64 = c.toDataURL('image/jpeg', q).split(',')[1]; }
        res(b64);
      };
      im.onerror = function () { clearTimeout(to); URL.revokeObjectURL(u); rej(new Error('Không đọc được ảnh, thử ảnh JPG/PNG khác')); };
      im.src = u;
    });
  }
  function uploadOne(file, say) {
    say('đang nén');
    return compress(file).then(function (b64) {
      say('đang gửi ' + Math.round(b64.length / 1024) + ' KB');
      var ac = new AbortController(), t = setTimeout(function () { ac.abort(); }, 60000);
      return fetch('/api/flower-upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: b64 }), signal: ac.signal })
        .then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw new Error(e.name === 'AbortError' ? 'quá thời gian chờ, thử lại' : e.message); });
    }).then(function (r) {
      return r.text().then(function (tx) {
        var j; try { j = JSON.parse(tx); } catch (e) { throw new Error('máy chủ trả lỗi ' + r.status); }
        if (!r.ok) throw new Error(j.error || 'lỗi tải ảnh');
        return j.url;
      });
    });
  }
  function pickPhotos(files) {
    var box = $('photos'), msg = $('upMsg'), list = Array.prototype.slice.call(files), i = 0;
    var room = 10 - lines(box.value).length;
    if (room <= 0) { msg.textContent = 'Đã đủ 10 ảnh.'; return; }
    list = list.slice(0, room);
    (function next() {
      if (i >= list.length) { msg.textContent = 'Xong, đã thêm ' + list.length + ' ảnh.'; save(); return; }
      uploadOne(list[i], function (st) { msg.textContent = 'Ảnh ' + (i + 1) + '/' + list.length + ': ' + st + '…'; }).then(function (u) {
        box.value = (box.value.trim() ? box.value.replace(/\s+$/, '') + '\n' : '') + u;
        i++; next();
      }).catch(function (e) { msg.textContent = 'Lỗi ảnh ' + (i + 1) + ': ' + e.message; });
    })();
  }

  restore();
  FIELDS.forEach(function (id) { $(id).addEventListener('input', save); });
  $('make').addEventListener('click', create);
  $('copy').addEventListener('click', copyLink);
  $('dl').addEventListener('click', download);
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () { pickPhotos(this.files); this.value = ''; });
})();
</script>
</body></html>
