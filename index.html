<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quà tặng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root { --bg: #fae1dd; --accent: #e6668a; --s: 1; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.script { font-family: 'Dancing Script', 'Brush Script MT', cursive; }

/* ===== Màn hình 1: bông hồng ===== */
.stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: var(--bg); }
#stageRose { flex-direction: column; cursor: pointer; }
#roseSvg { width: min(80vw, 60vh, 420px); height: auto; }
#roseHint { margin-top: 12px; font-size: clamp(26px, 7vw, 40px); color: indianred; opacity: 0; transition: opacity .8s; text-align: center; padding: 0 16px; }
#roseHint.on { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ===== Màn hình 2: phong thư ===== */
#stageCastle { opacity: 0; transition: opacity .8s; }
#stageCastle.on { opacity: 1; }
.letter { position: relative; width: 300px; height: 200px; transform: scale(var(--s)); transform-origin: center; z-index: 1; }
.valentines { position: relative; top: 50px; cursor: pointer; animation: up 3s linear infinite; }
@keyframes up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
.envelope { position: relative; width: 300px; height: 200px; background-color: #f08080; }
.envelope:before { background-color: #f08080; content: ""; position: absolute; width: 212px; height: 212px; transform: rotate(45deg); top: -105px; left: 44px; border-radius: 30px 0 0 0; }
.card { position: absolute; background-color: #eae2b7; width: 270px; height: 170px; top: 5px; left: 15px; box-shadow: -5px -5px 100px rgba(0,0,0,.4); transition: top .6s ease; }
.valentines.open .card { top: -90px; }
@media (hover: hover) { .valentines:hover .card { top: -90px; } }
.card:before { content: ""; position: absolute; border: 3px dotted #003049; width: 240px; height: 140px; left: 12px; top: 12px; }
.card .text { position: absolute; left: 0; right: 0; top: 19px; text-align: center; font-family: 'Dancing Script','Brush Script MT',cursive; font-size: 28px; line-height: 25px; color: #003049; padding: 0 20px; word-break: break-word; }
.heart { background-color: #d62828; display: inline-block; height: 30px; margin: 0 10px; position: relative; top: 110px; left: 105px; transform: rotate(-45deg); width: 30px; }
.heart:before, .heart:after { content: ""; background-color: #d62828; border-radius: 50%; height: 30px; position: absolute; width: 30px; }
.heart:before { top: -15px; left: 0; }
.heart:after { left: 15px; top: 0; }
.hearts { position: absolute; top: 0; }
.hearts i { background-color: red; display: inline-block; height: 10px; margin: 0 10px; position: relative; transform: rotate(-45deg); width: 10px; top: 50px; }
.hearts i:before, .hearts i:after { content: ""; background-color: red; border-radius: 50%; height: 10px; position: absolute; width: 10px; }
.hearts i:before { top: -5px; left: 0; }
.hearts i:after { left: 5px; top: 0; }
.hearts i:nth-child(1) { left: 10px; animation: heart 1s ease-out infinite; }
.hearts i:nth-child(2) { left: 30px; animation: heart 2s ease-out infinite; }
.hearts i:nth-child(3) { left: 50px; animation: heart 1.5s ease-out infinite; }
.hearts i:nth-child(4) { left: 70px; animation: heart 2.3s ease-out infinite; }
.hearts i:nth-child(5) { left: 90px; animation: heart 1.7s ease-out infinite; }
@keyframes heart {
  0% { transform: translateY(0) rotate(-45deg) scale(.3); opacity: 1; }
  100% { transform: translateY(-150px) rotate(-45deg) scale(1.3); opacity: .5; }
}
.front { position: absolute; border-right: 180px solid #f4978e; border-top: 95px solid transparent; border-bottom: 100px solid transparent; left: 120px; top: 5px; width: 0; height: 0; z-index: 10; }
.front:before { position: absolute; content: ""; border-left: 300px solid #f8ad9d; border-top: 195px solid transparent; left: -120px; top: -95px; width: 0; height: 0; }
.shadow { position: absolute; width: 330px; height: 25px; border-radius: 50%; background-color: rgba(0,0,0,.3); top: 265px; left: -15px; animation: shadowScale 3s linear infinite; z-index: -1; }
@keyframes shadowScale { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.85); } }
#dust { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#dust span { position: absolute; background: #fff; border-radius: 100%; box-shadow: 0 0 3px 1px #fff; opacity: 0; }

/* chữ chạy quanh trái tim */
#ringSvg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94vw, 620px); height: auto; pointer-events: none; z-index: 5; }
#ringSvg text { fill: var(--accent); font-family: 'Dancing Script', cursive, system-ui; font-weight: 700; }

#hint { position: fixed; left: 0; right: 0; bottom: calc(6% + env(safe-area-inset-bottom)); text-align: center; font-size: 26px; color: var(--accent); z-index: 6; pointer-events: none; opacity: 0; transition: opacity .6s; }
#hint.on { opacity: .9; }

/* ===== Thư ===== */
.overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.7); display: flex; justify-content: center; align-items: center; padding: 16px; animation: fade .3s; }
@keyframes fade { from { opacity: 0; } }
.close { position: absolute; right: 16px; top: calc(12px + env(safe-area-inset-top)); width: 44px; height: 44px; border: 0; background: transparent; color: #fff; font-size: 28px; cursor: pointer; z-index: 5; }
.paper { position: relative; width: min(100%, 600px); max-height: 88vh; max-height: 88dvh; background: #ffebeb; border-radius: 20px; padding: 18px 14px; box-shadow: 0 3px 8px rgba(0,0,0,.24); z-index: 1; }
.paper:before { content: ""; position: absolute; inset: 0; background: #fff; border-radius: 20px; transform: rotate(-5deg); z-index: -1; }
.paper-in { position: relative; border: 2px dashed #ff6666; border-radius: 16px; padding: 22px 18px 26px; min-height: 320px; max-height: calc(88vh - 40px); max-height: calc(88dvh - 40px); overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; user-select: none; overflow-x: hidden; }
.pin { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #ffebeb; color: #ff6666; display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 3; }
.pin.tr { right: 5px; top: 10px; }
.pin.bl { left: 5px; bottom: 10px; }
.gift { font-size: 46px; line-height: 1; animation: bob 2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }
#lt { font-size: clamp(30px, 8vw, 40px); color: #b3224a; margin-top: 8px; min-height: 1.3em; }
#lc { font-size: clamp(18px, 4.6vw, 22px); line-height: 1.45; margin-top: 10px; color: #3a1c2a; white-space: pre-line; position: static; }
#ls { font-size: clamp(22px, 5.5vw, 28px); color: #b3224a; margin-top: 14px; align-self: flex-end; padding-right: 8px; white-space: pre-line; }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 16px; z-index: 0; }
.floaters span { position: absolute; bottom: -20px; color: #ff6666; opacity: 0; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-420px) scale(1.2); opacity: 0; } }
.paper-in > *:not(.floaters) { position: relative; z-index: 1; }

/* ===== Bảng tạo quà ===== */
.modal { position: fixed; inset: 0; z-index: 2000; background: rgba(40,10,20,.55); display: flex; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; }
.sheet { width: min(100%, 520px); max-height: 94vh; max-height: 94dvh; overflow-y: auto; background: #fff; border-radius: 18px; padding: 20px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.sheet h1 { font-size: 22px; color: #b3224a; margin-bottom: 4px; }
.sheet .sub { font-size: 14px; color: #666; margin-bottom: 14px; line-height: 1.4; }
.sheet label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-top: 12px; }
.sheet small { display: block; font-weight: 400; color: #888; margin-top: 3px; }
.sheet input[type=text], .sheet textarea, .sheet select { width: 100%; margin-top: 5px; padding: 10px 12px; border: 1.5px solid #e4c9d0; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: #222; background: #fffafb; }
.sheet textarea { resize: vertical; }
.sheet input:focus, .sheet textarea:focus, .sheet select:focus { outline: 0; border-color: #e6668a; }
.sheet .row { display: flex; gap: 12px; }
.sheet .row label { flex: 1; }
.sheet input[type=color] { width: 100%; height: 42px; margin-top: 5px; border: 1.5px solid #e4c9d0; border-radius: 10px; background: #fffafb; padding: 3px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btns button { flex: 1 1 auto; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e6668a; background: #fff; color: #b3224a; font: inherit; font-weight: 600; cursor: pointer; }
.btns .primary { background: #e6668a; color: #fff; flex-basis: 100%; font-size: 17px; }
#btnEdit { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 900; border: 0; border-radius: 22px; padding: 9px 14px; background: rgba(255,255,255,.85); color: #b3224a; font: inherit; font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 3000; max-width: 90vw; text-align: center; }
</style>
</head>
<body>

<!-- Chữ chạy quanh trái tim -->
<svg id="ringSvg" viewBox="-120 -30 240 180" hidden aria-hidden="true">
  <defs><path id="heartPath" d="M0,21.054 C0,21.054 24.618,-15.165 60.75,8.554 C93.249,29.888 57.749,96.888 0,117.388 C-57.749,96.888 -93.249,29.888 -60.75,8.554 C-24.618,-15.165 0,21.054 0,21.054z"/></defs>

</svg>

  <p id="roseHint" class="script">Chạm vào bông hoa để mở quà 🌹</p>
</div>

<!-- Phong thư -->
<div class="stage" id="stageCastle" hidden>
  <div class="letter" id="letterBox">
    <div class="valentines" id="valentines">
      <div class="envelope"></div>
      <div class="front"></div>
      <div class="card">
        <div class="text" id="cardText"></div>
        <div class="heart"></div>
      </div>
      <div class="hearts"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="shadow"></div>
    <div id="dust"></div>
  </div>
</div>
<div id="hint" class="script">Chạm vào phong thư 💌</div>

<!-- Thư đang mở -->
<div class="overlay" id="overlay" hidden>
  <button class="close" id="btnCloseLetter" aria-label="Đóng thư">✕</button>
  <div class="paper" id="paper">
    <div class="paper-in" id="paperIn">
      <span class="pin tr">♥</span><span class="pin bl">♥</span>
      <div class="floaters" id="floaters"></div>
      <div class="gift">🎁</div>
      <h2 id="lt" class="script"></h2>
      <p id="lc" class="script"></p>
      <div id="ls" class="script"></div>
    </div>
  </div>
</div>

<!-- Bảng tạo quà -->
<div class="modal" id="setup" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <h1>🎁 Tạo quà tặng</h1>
    <p class="sub">Điền nội dung rồi bấm "Tạo quà tặng". Muốn gửi cho người khác thì bấm "Sao chép link".</p>

    <label>Dịp
      <select id="fPreset">
        <option value="2010">20/10 – Phụ nữ Việt Nam</option>
        <option value="0803">8/3 – Quốc tế Phụ nữ</option>
        <option value="bday">Sinh nhật</option>
        <option value="val">Valentine 14/2</option>
        <option value="custom">Tự do (giữ nguyên chữ đang gõ)</option>
      </select>
    </label>
    <label>Tiêu đề thư <input type="text" id="fTitle" maxlength="40"></label>
    <label>Nội dung thư
      <textarea id="fContent" rows="6" maxlength="900"></textarea>
      <small>Gõ {ngay} để tự điền ngày hôm nay.</small>
    </label>
    <label>Người gửi / lời ký <input type="text" id="fSign" maxlength="40"></label>
    <label>Chữ trên thẻ (tối đa 3 dòng)
      <textarea id="fCard" rows="3" maxlength="60"></textarea>
    </label>
    <label>Chữ chạy quanh trái tim <input type="text" id="fRing" maxlength="90"></label>
    <div class="row">
      <label>Màu nền <input type="color" id="fBg" value="#fae1dd"></label>
      <label>Màu chữ trái tim <input type="color" id="fAccent" value="#e6668a"></label>
    </div>
    <div class="btns">
      <button type="submit" class="primary">✨ Tạo quà tặng</button>
      <button type="button" id="btnLink">🔗 Sao chép link</button>
      <button type="button" id="btnCloseSetup">Đóng</button>
    </div>
  </form>
</div>

<button id="btnEdit" hidden>✏️ Sửa quà</button>
<div id="toast" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- Dữ liệu mẫu ---------- */
  var PRESETS = {

      sign: 'Con của mẹ',

      bg: '#fae1dd', accent: '#e6668a'
    },
    '0803': {

      content: 'Hôm nay là ngày {ngay}, ngày Quốc tế Phụ nữ. Chúc mẹ luôn khỏe mạnh, luôn tươi trẻ và thật nhiều niềm vui. Cảm ơn mẹ vì đã luôn ở bên con.\n\nCon yêu mẹ! 💗',
      sign: 'Con của mẹ',
      card: 'Happy\nWomen\'s\nDay!',
      ring: '🌹 Happy Women\'s Day 8/3 🌹 With Love 🌹',
      bg: '#fae1dd', accent: '#e6668a'
    },
    'bday': {
      title: 'Chúc mừng sinh nhật!',
      content: 'Hôm nay là ngày {ngay}. Chúc bạn tuổi mới thật nhiều sức khỏe, thật nhiều niềm vui và mọi điều mình mong ước đều thành hiện thực. 🎂',
      sign: 'Thân tặng',
      card: 'Happy\nBirthday!',
      ring: '🎂 Chúc mừng sinh nhật 🎉 Tuổi mới rực rỡ 🎂',
      bg: '#fff1cc', accent: '#e07b00'
    },
    'val': {
      title: 'Gửi người thương!',
      content: 'Hôm nay là ngày {ngay}. Cảm ơn em/anh vì đã xuất hiện trong cuộc đời này. Mong những ngày tháng sau, mình vẫn luôn nắm tay nhau như thế. 💕',
      sign: 'Yêu em/anh',
      card: 'Happy\nValentine!',
      ring: '💕 Happy Valentine 14/2 💕 Yêu thương mãi 💕',
      bg: '#ffd6e0', accent: '#d6336c'
    }
  };

  var COLOR_RE = /^#[0-9a-f]{6}$/i;
  function cleanCfg(o) {
    var d = PRESETS['2010'];
    function str(v, max, fb) { return (typeof v === 'string' && v.length) ? v.slice(0, max) : fb; }
    return {
      title: str(o.title, 40, d.title),
      content: str(o.content, 900, d.content),
      sign: typeof o.sign === 'string' ? o.sign.slice(0, 40) : '',
      card: str(o.card, 60, d.card),
      ring: str(o.ring, 90, d.ring),
      bg: COLOR_RE.test(o.bg) ? o.bg : d.bg,
      accent: COLOR_RE.test(o.accent) ? o.accent : d.accent
    };
  }

  /* ---------- Tiện ích ---------- */
  function today() {
    var t = new Date();
    return ('0' + t.getDate()).slice(-2) + '/' + ('0' + (t.getMonth() + 1)).slice(-2) + '/' + t.getFullYear();
  }
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 3200);
  }
  function encodeCfg(cfg) { return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(cfg))))); }
  function decodeCfg(s) { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(s))))); }
  function saveLocal(cfg) { try { localStorage.setItem('quatang_cfg', JSON.stringify(cfg)); } catch (e) {} }
  function loadLocal() { try { var s = localStorage.getItem('quatang_cfg'); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  /* ---------- Trạng thái ---------- */
  var cfg = null, shareMode = false, letterTok = 0, skipTyping = false, ringTimer = null, roseTimers = [];

  /* ---------- Bông hồng ---------- */
  var rosePaths = Array.prototype.slice.call(document.querySelectorAll('#roseSvg path'));
  function drawRose() {
    roseTimers.forEach(clearTimeout); roseTimers = [];
    $('#roseHint').classList.remove('on');
    rosePaths.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.transition = 'none';
      p.style.fill = 'none';
      p.style.stroke = '#222';
      p.style.strokeWidth = '3';
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
    void $('#roseSvg').getBoundingClientRect();
    requestAnimationFrame(function () {
      rosePaths.forEach(function (p) {
        p.style.transition = 'stroke-dashoffset 4s ease-in-out';
        p.style.strokeDashoffset = 0;
      });
    });
    roseTimers.push(setTimeout(function () {
      rosePaths.forEach(function (p) {
        p.style.transition = 'fill 1s, stroke 1s';
        p.style.fill = p.getAttribute('data-c');
        p.style.stroke = 'transparent';
      });
    }, 4100));
    roseTimers.push(setTimeout(function () { $('#roseHint').classList.add('on'); }, 4300));
  }

  /* ---------- Bụi lấp lánh ---------- */
  (function buildDust() {
    var data = [
      [130,132,150,152,.15,2.5,.1],[65,63,300,299,.5,2,.2],[70,70,150,150,.45,2,.5],[75,78,160,170,.6,2,1],
      [80,82,160,180,.6,1,.4],[85,100,160,170,.5,2,.5],[125,110,170,180,.25,3,1.5],[90,90,115,115,.4,2,2],
      [93,95,200,200,.4,3,1.5],[100,100,145,155,.45,1,.5],[100,90,170,230,.35,2,.75],[100,102,115,112,.35,3,.25],
      [100,95,170,200,.55,1.5,.75],[100,97,150,190,.7,2,1.5],[105,100,160,180,.5,1.5,.725],[125,125,180,190,.25,1,.725],
      [130,130,135,135,.45,3,1.5],[135,132,170,190,.25,2.5,.75],[135,132,320,315,.2,5,.3]
    ];
    var css = '', box = $('#dust');
    data.forEach(function (o, i) {
      var x1 = o[0], x2 = o[1], y1 = o[2], y2 = o[3], r = o[4], dur = o[5], delay = o[6];
      css += '@keyframes blink' + i + '{' +
        '0%{top:' + y1 + 'px;left:' + x1 + 'px;width:' + 2*r + 'px;height:' + 2*r + 'px;opacity:.4}' +
        '20%{width:' + 4*r + 'px;height:' + 4*r + 'px;opacity:.8}' +
        '35%{width:' + 2*r + 'px;height:' + 2*r + 'px;opacity:.5}' +
        '55%{width:' + 3*r + 'px;height:' + 3*r + 'px;opacity:.7}' +
        '80%{width:' + r + 'px;height:' + r + 'px;opacity:.3}' +
        '100%{top:' + y2 + 'px;left:' + x2 + 'px;width:0;height:0;opacity:.1}}';
      var s = document.createElement('span');
      s.style.animation = 'blink' + i + ' ' + dur + 's cubic-bezier(.71,.11,.68,.83) infinite ' + delay + 's';
      box.appendChild(s);
    });
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  })();

  /* ---------- Chữ chạy quanh trái tim ---------- */
  function startRing() {
    clearInterval(ringTimer);
    var tp = $('#ringText'), txt = $('#ringSvg text'), path = $('#heartPath');
    var L = path.getTotalLength();
    var unit = (cfg.ring || '🌹').trim(), sep = '   🌹   ', full = unit, n = 0;
    txt.setAttribute('font-size', 9);
    tp.textContent = full;
    while (tp.getComputedTextLength() < L * 0.95 && n < 30) { full += sep + unit; tp.textContent = full; n++; }
    var w = tp.getComputedTextLength();
    var fs = w > L ? 9 * (L * 0.97 / w) : 9;
    txt.setAttribute('font-size', Math.max(3, fs));
    var chars = Array.from(full), i = 0;
    tp.textContent = '';
    ringTimer = setInterval(function () {
      i++;
      tp.textContent = chars.slice(0, i).join('');
      if (i >= chars.length) clearInterval(ringTimer);
    }, 35);
  }

  /* ---------- Bố cục / co giãn ---------- */
  function layout() {
    var svgW = Math.min(window.innerWidth * 0.94, 620);
    var heartW = svgW * 186 / 240;
    var s = Math.min(1, heartW * 0.8 / 300, (window.innerHeight * 0.72) / 330);
    document.documentElement.style.setProperty('--s', Math.max(0.5, s).toFixed(3));
  }
  window.addEventListener('resize', layout);

  /* ---------- Áp dụng cấu hình ---------- */
  function applyCfg() {
    document.title = cfg.title;
    var r = document.documentElement.style;
    r.setProperty('--bg', cfg.bg); r.setProperty('--accent', cfg.accent);
    var box = $('#cardText'); box.textContent = '';
    cfg.card.split('\n').slice(0, 3).forEach(function (line, i) {
      if (i) box.appendChild(document.createElement('br'));
      box.appendChild(document.createTextNode(line));
    });
    var lines = Math.min(3, cfg.card.split('\n').length);
    box.style.fontSize = lines > 2 ? '24px' : '28px';
  }

  function start() {
    closeLetter();
    clearInterval(ringTimer);
    $('#ringText').textContent = '';
    $('#ringSvg').hidden = true;
    $('#stageCastle').hidden = true; $('#stageCastle').classList.remove('on');
    $('#hint').classList.remove('on');
    $('#valentines').classList.remove('open');
    applyCfg();
    $('#stageRose').hidden = false;
    drawRose();
  }

  $('#stageRose').addEventListener('click', function () {
    if (!cfg) return;
    roseTimers.forEach(clearTimeout);
    $('#stageRose').hidden = true;
    $('#stageCastle').hidden = false;
    $('#ringSvg').hidden = false;
    layout();
    requestAnimationFrame(function () {
      $('#stageCastle').classList.add('on');
      startRing();
    });
    setTimeout(function () { $('#hint').classList.add('on'); }, 1200);
  });

  /* ---------- Phong thư: chạm để mở ---------- */
  $('#valentines').addEventListener('click', function () {
    var v = $('#valentines');
    var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
    if (canHover || v.classList.contains('open')) openLetter();
    else v.classList.add('open');
  });

  /* ---------- Thư ---------- */
  function typeText(el, str, speed, tok) {
    return new Promise(function (res) {
      var ch = Array.from(str), i = 0;
      el.textContent = '';
      (function step() {
        if (tok !== letterTok) return res();
        if (skipTyping) { el.textContent = str; return res(); }
        if (i >= ch.length) return res();
        el.textContent += ch[i++];
        setTimeout(step, speed);
      })();
    });
  }
  function buildFloaters() {
    var f = $('#floaters'); f.textContent = '';
    for (var i = 0; i < 12; i++) {
      var s = document.createElement('span');
      s.textContent = '♥';
      s.style.left = (Math.random() * 94) + '%';
      s.style.fontSize = (12 + Math.random() * 16) + 'px';
      s.style.animationDuration = (5 + Math.random() * 5) + 's';
      s.style.animationDelay = (Math.random() * 6) + 's';
      f.appendChild(s);
    }
  }
  function openLetter() {
    if (!cfg) return;
    var tok = ++letterTok; skipTyping = false;
    $('#overlay').hidden = false;
    $('#lt').textContent = ''; $('#lc').textContent = ''; $('#ls').textContent = '';
    $('#paperIn').scrollTop = 0;
    buildFloaters();
    var content = cfg.content.replace(/\{ngay\}/gi, today());
    typeText($('#lt'), cfg.title, 90, tok)
      .then(function () { return typeText($('#lc'), content, 35, tok); })
      .then(function () { return cfg.sign ? typeText($('#ls'), '— ' + cfg.sign + ' —', 60, tok) : null; });
  }
  function closeLetter() { letterTok++; $('#overlay').hidden = true; }
  $('#btnCloseLetter').addEventListener('click', closeLetter);
  $('#overlay').addEventListener('click', function (e) { if (e.target === this) closeLetter(); });
  $('#paper').addEventListener('click', function () { skipTyping = true; });

  /* ---------- Bảng tạo quà ---------- */
  function fillForm(c) {
    $('#fTitle').value = c.title; $('#fContent').value = c.content; $('#fSign').value = c.sign;
    $('#fCard').value = c.card; $('#fRing').value = c.ring; $('#fBg').value = c.bg; $('#fAccent').value = c.accent;
  }
  function readForm() {
    return cleanCfg({
      title: $('#fTitle').value.trim(), content: $('#fContent').value.trim(), sign: $('#fSign').value.trim(),
      card: $('#fCard').value.trim(), ring: $('#fRing').value.trim(), bg: $('#fBg').value, accent: $('#fAccent').value
    });
  }
  function openSetup() { $('#setup').hidden = false; $('#btnEdit').hidden = true; }
  function closeSetup() { $('#setup').hidden = true; if (cfg && !shareMode) $('#btnEdit').hidden = false; }

  $('#fPreset').addEventListener('change', function () {
    var p = PRESETS[this.value];
    if (p) fillForm(p);
  });
  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    cfg = readForm(); saveLocal(cfg);
    $('#setup').hidden = true;
    $('#btnEdit').hidden = false;
    start();
  });
  $('#btnCloseSetup').addEventListener('click', function () {
    if (!cfg) { cfg = readForm(); saveLocal(cfg); start(); }
    closeSetup();
  });
  $('#btnEdit').addEventListener('click', openSetup);

  $('#btnLink').addEventListener('click', function () {
    var link = location.href.split('#')[0] + '#d=' + encodeCfg(readForm());
    var local = /^(file|content):/.test(location.protocol);
    function done() {
      toast(local ? 'Đã sao chép. Lưu ý: file đang mở từ máy, cần đưa lên hosting thì người khác mới mở được link.' : 'Đã sao chép link quà tặng!');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, function () { window.prompt('Sao chép link này:', link); });
    } else { window.prompt('Sao chép link này:', link); }
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLetter(); });

  /* ---------- Khởi động ---------- */
  layout();
  var m = location.hash.match(/^#d=(.+)$/);
  if (m) {
    try { cfg = cleanCfg(decodeCfg(m[1])); shareMode = true; } catch (e) { cfg = null; }
  }
  if (cfg && shareMode) {
    start();
  } else {
    var saved = loadLocal();
    fillForm(saved ? cleanCfg(saved) : PRESETS['2010']);
    $('#setup').hidden = false;
  }
})();
</script>
</body>
</html>
