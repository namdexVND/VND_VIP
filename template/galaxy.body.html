<div id="container"></div>
<div id="rotate-warning">📱 Xoay ngang điện thoại để xem đẹp hơn</div>
<button id="tap-btn" type="button">♡ Chạm vào màn hình ♡</button>
<button id="wish-btn" type="button">🌠 Gửi điều ước</button>
<div id="photo-rise"></div>
<button id="letter-icon" type="button" aria-label="Mở thư">💌</button>
<div id="letter-stage">
  <div class="veil"></div>
  <canvas id="letter-fx"></canvas>
  <div class="bar top"></div><div class="bar bot"></div>
  <button id="letter-x" type="button" aria-label="Đóng">✕</button>
  <div id="env">
    <div class="env-back"></div>
    <div class="env-paper"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal">♥</div>
  </div>
  <div id="letter-paper"></div>
</div>
<div id="wish-panel">
  <h3>Gửi điều ước lên sao băng</h3>
  <textarea id="wish-input" maxlength="90" placeholder="Viết lời chúc của bạn..."></textarea>
  <div class="wish-actions">
    <button id="wish-close" type="button">Đóng</button>
    <button id="wish-send" type="button">Bay lên ✦</button>
  </div>
</div>
